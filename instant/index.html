<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Arena FPS</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="hud">
      <div id="health-row">
        <span>You: <strong id="player-hp">100</strong></span>
        <span>Bot: <strong id="enemy-hp">100</strong></span>
      </div>
      <p id="hint">Click the arena to focus · Arrows or WASD · Space or left-click to shoot</p>
    </div>
    <div id="crosshair"></div>
    <div id="overlay" class="hidden">
      <h1 id="overlay-title">Game Over</h1>
      <p id="overlay-msg"></p>
      <button type="button" id="restart">Play again</button>
    </div>
    <canvas id="c" tabindex="0" aria-label="Game — click here then use keys"></canvas>
    <script defer src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>
    <script defer src="game.js"></script>
  </body>
</html>
